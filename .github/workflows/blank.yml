name: Extract and Release boot.img

on:
  workflow_dispatch:   # 支持在 Actions 页面手动触发
  push:
    tags:
      - 'v*'           # 推送 v 开头的 tag 时自动触发

permissions:
  contents: write      # 必须，否则无法创建 Release

jobs:
  extract-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download ZIP from release
        run: |
          curl -L -o a17-boot.zip \
            https://github.com/Geeeeeker/boot/releases/download/lineage-24-raphael-20261029-134503/a17-boot-5.4.zip

      - name: Extract ZIP and locate boot.img
        run: |
          # 使用 unzip 解压；-o 覆盖已存在文件，-d 指定输出目录
          unzip -o a17-boot.zip -d extracted/
          echo "=== 解压后的文件列表 ==="
          find extracted/ -type f
          # 查找 boot.img 并复制到工作区根目录，方便后续上传
          BOOT_IMG=$(find extracted/ -name 'boot.img' -type f | head -n 1)
          if [ -z "$BOOT_IMG" ]; then
            echo "错误：解压后未找到 boot.img"
            exit 1
          fi
          cp "$BOOT_IMG" ./boot.img
          ls -lh ./boot.img

      - name: Upload boot.img to Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'   # 仅在 tag 触发时创建 Release
        with:
          files: boot.img
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
